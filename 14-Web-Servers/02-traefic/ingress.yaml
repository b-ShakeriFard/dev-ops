apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: web-lab-ingress
  namespace: web-lab

spec:
  ingressClassName: traefik

  rules:
    - host: app1.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app1
                port:
                  number: 80

    - host: app2.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80
